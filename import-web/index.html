<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSV plan import</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px auto; max-width: 40rem; line-height: 1.4; }
    label { display: block; margin-top: 12px; }
    input, select, button { font: inherit; }
    input[type="email"], input[type="password"], input[type="text"], select { width: 100%; box-sizing: border-box; }
    button { margin-top: 16px; margin-right: 8px; }
    .message { min-height: 1.4em; }
    .error { color: #8d1d1d; }
    ul { padding-left: 1.2rem; }
    li { margin: 6px 0; }
  </style>
</head>
<body>
  <h1>CSV plan import</h1>
  <p>Log in, choose a plan you own or collaborate on, and choose a CSV file. Then pick a CSV column for each field. Spreadsheet files (.xlsx) are not accepted.</p>

  <form id="session-form">
    <label>Email
      <input id="email" type="email" name="email" autocomplete="username">
    </label>
    <label>Password
      <input id="password" type="password" name="password" autocomplete="current-password">
    </label>
    <button id="login-button" type="submit">Log in</button>
    <button id="logout-button" type="button" hidden>Log out</button>
  </form>

  <p id="message" class="message" role="status"></p>

  <form id="import-form" hidden>
    <label>Plan
      <select id="plan-select" name="plan"></select>
    </label>
    <label>New plan name
      <input id="plan-name" type="text" name="plan-name" autocomplete="off" placeholder="Leave empty for the generated name">
    </label>
    <label>CSV file
      <input id="csv-file" type="file" name="csv-file" accept=".csv,text/csv">
    </label>
    <div id="column-map" hidden>
      <p>Choose a CSV column for each field.</p>
      <label>Name
        <select id="col-name" name="col-name"></select>
      </label>
      <label>Type
        <select id="col-type" name="col-type"></select>
      </label>
      <label id="default-type-label">Default type
        <select id="default-type" name="default-type">
          <option value="tour">tour</option>
          <option value="dining">dining</option>
          <option value="hotel">hotel</option>
        </select>
      </label>
      <label>Start time
        <select id="col-start" name="col-start"></select>
      </label>
      <label>End time
        <select id="col-end" name="col-end"></select>
      </label>
      <label>Location
        <select id="col-location" name="col-location"></select>
      </label>
    </div>
    <button type="submit">Import CSV</button>
  </form>

  <h2>Plans</h2>
  <ul id="plan-list"></ul>

  <script src="app.js"></script>
</body>
</html>
