<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSV plan import</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px auto; max-width: 40rem; line-height: 1.4; }
    label { display: block; margin-top: 12px; }
    input, select, button { font: inherit; }
    input[type="url"], input[type="email"], input[type="password"], input[type="text"], select { width: 100%; box-sizing: border-box; }
    button { margin-top: 16px; margin-right: 8px; }
    .message { min-height: 1.4em; }
    .error { color: #8d1d1d; }
    ul { padding-left: 1.2rem; }
    li { margin: 6px 0; }
  </style>
</head>
<body>
  <h1>CSV plan import</h1>
  <p>Log in, choose a plan you own or collaborate on, and choose a CSV file. The server creates a new plan from that file. Spreadsheet files (.xlsx) are not accepted.</p>

  <form id="session-form">
    <label>API address
      <input id="api-base" type="url" name="api-base" autocomplete="off" spellcheck="false">
    </label>
    <label>Email
      <input id="email" type="email" name="email" autocomplete="username">
    </label>
    <label>Password
      <input id="password" type="password" name="password" autocomplete="current-password">
    </label>
    <button id="login-button" type="submit">Log in</button>
    <button id="logout-button" type="button" hidden>Log out</button>
  </form>

  <p id="message" class="message" role="status"></p>

  <form id="import-form" hidden>
    <label>Plan
      <select id="plan-select" name="plan"></select>
    </label>
    <label>CSV file
      <input id="csv-file" type="file" name="csv-file" accept=".csv,text/csv">
    </label>
    <p>Column map. Each value is the header name in the CSV.</p>
    <label>Name column
      <input id="col-name" type="text" name="col-name" value="name" autocomplete="off">
    </label>
    <label>Type column
      <input id="col-type" type="text" name="col-type" value="type" autocomplete="off">
    </label>
    <label>Start time column
      <input id="col-start" type="text" name="col-start" value="startTime" autocomplete="off">
    </label>
    <label>End time column
      <input id="col-end" type="text" name="col-end" value="endTime" autocomplete="off">
    </label>
    <label>Location column
      <input id="col-location" type="text" name="col-location" value="location" autocomplete="off">
    </label>
    <button type="submit">Import CSV</button>
  </form>

  <h2>Plans</h2>
  <ul id="plan-list"></ul>

  <script src="app.js"></script>
</body>
</html>
