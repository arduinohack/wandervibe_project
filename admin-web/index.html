<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WanderVibe Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <p id="login-banner" hidden></p>
  <header>
    <h1>WanderVibe Admin</h1>
    <nav id="app-nav" hidden>
      <a href="#logs">Logs</a>
      <a href="#settings">Settings</a>
    </nav>
    <button id="logout" type="button" hidden>Log out</button>
  </header>
  <main>
    <section id="login-panel">
      <h2>Log in</h2>
      <form id="login-form">
        <label>Email
          <input id="email" name="email" type="email" autocomplete="username" required>
        </label>
        <label>Password
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Log in</button>
      </form>
      <p id="login-error" role="alert"></p>
    </section>

    <div id="app-panel" hidden>
      <div id="logs-page">
      <section>
        <div class="logs-heading">
          <h2>Support logs</h2>
          <div class="user-picker">
            <div class="user-picker-field">
              <label>Find account
                <input id="admin-account-filter" class="user-picker-query" type="text" name="admin-account-filter" autocomplete="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other">
              </label>
              <ul class="user-picker-results" role="listbox" hidden></ul>
            </div>
            <p class="user-picker-chosen"></p>
          </div>
        </div>
        <form id="logs-form">
          <label>Event
            <input id="filter-event" name="event" type="text" autocomplete="off">
          </label>
          <label>Plan id
            <input id="filter-plan" name="planId" type="text" autocomplete="off">
          </label>
          <button type="submit">Load logs</button>
        </form>
        <p id="logs-status" role="status"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th id="created-at-header">createdAt</th>
                <th>event</th>
                <th>level</th>
                <th>actorUserId</th>
                <th>planId</th>
                <th>message</th>
              </tr>
            </thead>
            <tbody id="logs-body"></tbody>
          </table>
        </div>
      </section>

      <section>
        <h2>Delete user</h2>
        <form id="delete-form">
          <div class="user-picker">
            <div class="user-picker-field">
              <label>Find account
                <input id="admin-account-delete" class="user-picker-query" type="text" name="admin-account-delete" autocomplete="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other">
              </label>
              <ul class="user-picker-results" role="listbox" hidden></ul>
            </div>
            <p class="user-picker-chosen"></p>
          </div>
          <input id="delete-user-id" name="userId" type="hidden">
          <button type="submit">Delete user</button>
        </form>
        <p id="delete-status" role="status"></p>
        <ul id="delete-plans"></ul>
      </section>
      </div>

      <section id="settings-page" hidden>
        <h2>Settings</h2>
        <form id="settings-form">
          <label>Display time zone
            <select id="display-time-zone" name="displayTimeZone"></select>
          </label>
          <label>Search delay (seconds)
            <input id="search-delay" name="searchDelaySec" type="number" min="0.5" max="10" step="0.1" value="2" inputmode="decimal">
          </label>
          <h2>Text styles</h2>
          <div id="style-fields"></div>
          <button type="submit">Save</button>
        </form>
        <p id="settings-status" role="status"></p>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
